# Ghost Map Editor - configuracao (editavel sem recompilar)
# desenvolvido por Ghost - www.hkfirewall.com
#
# Este arquivo tem que ficar AO LADO do GhostMapEditor.exe.

# Hole que abre sozinho ao iniciar. Deixe vazio pra abrir com Ctrl+O
# (ou arrastando o .gbin pra janela).
# exemplo: gbin=C:\PangYa\data\round10_spring wind\map\pink_01.gbin
gbin=

# Pastas onde o editor procura os .pet e as texturas.
# Ponha aqui a pasta RAIZ de cada mapa extraido: e de onde sai o catalogo de
# objetos. Quanto mais mapas voce listar, maior o catalogo (existem ~780 .pet
# unicos nos 15 rounds). Pode repetir a linha quantas vezes quiser.
# Voce tambem pode arrastar uma pasta pra janela do editor pra somar na hora.
asset_root=C:\PangYa\data\round10_spring wind
asset_root=C:\PangYa\data\round01_wind\ase

# velocidade da camera (roda do mouse muda em tempo real) e campo de visao
move_speed=220
fov=70
